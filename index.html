<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>大智度論 · 卷七十八 · 釋願樂品 ‧ 釋稱揚品 彙整</title><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&amp;family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/><style>
:root{
  --bg:#f7f3ec; --text:#2c2416; --text2:#5a4e3a; --text-muted:#6B5B4B;
  --accent:#8b5e3c; --accentL:#c4956a; --accent-red:#8B2500;
  --gold:#b8860b; --goldL:#d4a84b; --gold-light:#C9A84C;
  --border:#d4c4a8; --border-light:#EDE8E0; --card:#fffdf7;
  --verseBg:#f0e8d8; --verseBd:#c4956a;
  --sbW:76px; --sbBg:#1e1a14; --sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{scrollbar-width:none;-ms-overflow-style:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
*{-webkit-user-drag:none;scrollbar-width:none}
body{font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;background:var(--bg);color:var(--text);font-size:20px;line-height:1.85}

/* ========== 側欄 ========== */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;background:var(--sbBg);color:var(--sbText);z-index:100;display:flex;flex-direction:column;align-items:center;padding:0 0 16px;overflow-y:auto;scrollbar-width:none}
#sb::-webkit-scrollbar{display:none}
.sb-brand{position:sticky;top:0;width:100%;font-family:"Noto Sans TC",sans-serif;font-size:11px;letter-spacing:2px;color:var(--gold);text-align:center;line-height:1.5;background:linear-gradient(to bottom,var(--sbBg) 78%,rgba(30,26,20,0));padding:14px 4px 12px;margin-bottom:6px;z-index:5;text-decoration:none;cursor:pointer;transition:color .25s;display:block;border-bottom:1px solid rgba(184,134,11,.25)}
.sb-brand:hover{color:var(--goldL)}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78}
.sb-brand .sb-brand-line2{display:block;font-size:13px;font-weight:700;letter-spacing:2.2px;color:var(--goldL);margin-top:2px}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:2px}
.sb-nav{display:flex;flex-direction:column;gap:6px;padding:8px 4px;width:100%}
.sb-item{display:flex;flex-direction:column;align-items:center;padding:5px 4px;text-decoration:none;color:var(--sbText);transition:.25s;border-radius:6px}
.sb-item:hover{background:rgba(184,134,11,.12);color:var(--goldL)}
.sb-item.active{background:rgba(184,134,11,.22);color:var(--goldL);box-shadow:0 0 12px rgba(184,134,11,.25)}
.sb-circle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1.5px solid currentColor;font-family:"Noto Sans TC",sans-serif;font-size:15px;font-weight:600;margin-bottom:3px}
.sb-label{font-size:11.5px;letter-spacing:.5px;text-align:center;line-height:1.25;font-family:"Noto Sans TC",sans-serif}

/* ========== 進度膠囊 ========== */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:120;background:rgba(30,26,20,.92);color:var(--gold);padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:2px;display:flex;align-items:center;gap:12px;pointer-events:none;user-select:none;backdrop-filter:blur(6px);transition:opacity .45s ease,transform .45s ease}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);border-radius:2px;overflow:hidden;position:relative}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px}
.read-progress .rp-label{font-size:13px;opacity:.85;letter-spacing:4px;color:var(--goldL)}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px)}

/* ========== 主版面 ========== */
.main{margin-left:var(--sbW);min-height:100vh}
#sbToggle{display:none;position:fixed;top:14px;left:14px;z-index:110;background:var(--sbBg);color:var(--gold);border:1px solid var(--gold);width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
#backTop{position:fixed;right:24px;bottom:80px;width:44px;height:44px;border-radius:50%;border:1px solid var(--accent);background:var(--card);color:var(--accent);font-size:22px;cursor:pointer;display:none;z-index:90;box-shadow:0 2px 10px rgba(0,0,0,.12)}
#backTop.show{display:block}

/* ========== Hero ========== */
.site-hero{position:relative;background:var(--headGrad);color:#f4ead4;padding:68px 24px 60px;text-align:center;overflow:hidden}
.site-hero::before{content:"願樂";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:340px;font-weight:900;color:rgba(212,168,75,.04);letter-spacing:30px;font-family:"Noto Serif TC",serif;pointer-events:none}
.site-hero .hero-tag{font-family:"Noto Sans TC",sans-serif;font-size:14px;letter-spacing:6px;color:var(--goldL);opacity:.85}
.hero-title{font-size:56px;font-weight:900;margin:18px 0 6px;letter-spacing:6px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.hero-subtitle{font-size:20px;font-weight:400;color:var(--goldL);letter-spacing:4px;margin-bottom:14px}
.hero-meta{font-size:18px;color:#e6dcc4;letter-spacing:2px;margin:8px 0;opacity:.92}
.hero-range{font-family:"Noto Sans TC",sans-serif;font-size:17px;color:#d4c4a8;letter-spacing:2px;margin-top:18px}
.hero-en{font-family:Georgia,serif;font-style:italic;color:rgba(212,168,75,.7);font-size:15px;letter-spacing:2px;margin-top:8px}

/* ========== 編者前言 ========== */
.preface{max-width:880px;margin:48px auto 24px;padding:0 32px}
.preface-title{font-size:30px;color:var(--accent);text-align:center;letter-spacing:6px;font-weight:700;margin-bottom:20px;position:relative}
.preface-title::after{content:"";display:block;width:60px;height:2px;background:var(--gold);margin:14px auto 0}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin-bottom:14px;text-align:justify;text-indent:2em}

/* ========== 目次 ========== */
.toc-section{max-width:1100px;margin:36px auto 36px;padding:32px 32px 22px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 24px rgba(91,58,41,.06)}
.toc-title{font-size:34px;text-align:center;color:var(--accent);letter-spacing:8px;font-weight:700}
.toc-desc{text-align:center;color:var(--text-muted);font-size:17px;margin:10px 0 26px;letter-spacing:2px}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.toc-card{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;background:#fffaf0;border:1px solid var(--border);border-radius:10px;text-decoration:none;color:var(--text);transition:.22s}
.toc-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(184,134,11,.14);border-color:var(--gold)}
.toc-num{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;font-family:"Noto Sans TC",sans-serif;font-weight:700;font-size:18px}
.toc-name{flex:1;font-size:19.5px;line-height:1.7;font-weight:500}
.toc-name small{display:block;font-size:13.5px;color:var(--text-muted);font-weight:400;letter-spacing:1px;margin-top:3px}

/* ========== 章節 ========== */
.chapter{margin:48px auto 0;max-width:1180px;padding:0 24px}
.ch-head{background:var(--headGrad);color:#f4ead4;padding:42px 32px 36px;text-align:center;border-radius:14px 14px 0 0;position:relative;overflow:hidden}
.ch-head::after{content:"";position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ch-num{font-family:"Noto Sans TC",sans-serif;font-size:18px;letter-spacing:6px;color:var(--goldL);margin-bottom:14px;opacity:.9}
.ch-name{font-size:34px;font-weight:700;letter-spacing:4px;color:#fff;margin-bottom:10px}
.ch-sub{font-family:"Noto Sans TC",sans-serif;font-size:17px;color:#d4c4a8;letter-spacing:1.5px;line-height:1.7;max-width:760px;margin:0 auto;opacity:.92}
.ch-body{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;padding:38px 44px 46px;max-width:980px;margin:0 auto 0}

h2{font-size:30px;color:var(--accent);margin:32px 0 14px;padding:10px 0 10px 20px;border-left:4px solid var(--gold);background:linear-gradient(90deg,rgba(184,134,11,.07),transparent);letter-spacing:2px;font-weight:700}
h3{font-size:23.5px;color:var(--text);margin:24px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px;letter-spacing:1px;font-weight:600}
h4{font-size:20px;color:var(--text2);margin:18px 0 8px;font-weight:600}
h5{font-size:18.5px;color:var(--accent);margin:14px 0 6px;font-weight:600}
.ch-body p{font-size:20px;line-height:1.95;margin:0 0 14px;color:var(--text);text-align:justify}
strong,b{color:var(--accent-red);font-weight:700}
em{font-style:normal;color:var(--accent)}

/* ========== 偈頌 / 經典原典 ========== */
.verse,.gatha,blockquote{background:var(--verseBg);border-left:4px solid var(--verseBd);padding:18px 26px;margin:18px 0;line-height:2.1;font-size:22px;text-align:center;font-style:normal;border-radius:0 6px 6px 0}
.classical-text{background:#FFFDF5;border:1px solid #E8E0D0;border-radius:10px;padding:20px 26px;line-height:2;margin:16px 0;font-size:20px}
.text-label{display:inline-block;background:var(--text);color:#fff;font-family:"Noto Sans TC",sans-serif;font-size:13.5px;padding:3px 14px;border-radius:12px;letter-spacing:3px;margin-bottom:10px}

/* ========== 卡片類 ========== */
.card,.insight,.commentary,.note,.metaphor{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px 24px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card-title{font-size:21.5px;color:var(--accent);font-weight:700;margin-bottom:8px}
.card-content{font-size:20px;line-height:1.95;color:var(--text)}
.insight{border-left:5px solid var(--gold);background:linear-gradient(135deg,#fffdf5,#f8f0d8)}
.commentary{border-left:5px solid var(--accent)}
.note{border-left:4px solid var(--accentL);background:#fdf9ec}

/* ========== 問答 ========== */
.qa{margin:18px 0}
.qa .q,.qa .a{padding:14px 22px;border-radius:8px;margin:6px 0;font-size:20px;line-height:1.95}
.qa .q{background:rgba(91,124,168,.08);border-left:4px solid #5b7ca8;color:#234567}
.qa .a{background:rgba(139,46,21,.05);border-left:4px solid var(--accent-red);color:var(--text)}
.qa .q::before{content:"問曰";display:inline-block;background:#5b7ca8;color:#fff;font-family:"Noto Sans TC",sans-serif;font-size:12px;padding:2px 10px;border-radius:10px;letter-spacing:2px;margin-right:10px;vertical-align:middle}
.qa .a::before{content:"答曰";display:inline-block;background:var(--accent-red);color:#fff;font-family:"Noto Sans TC",sans-serif;font-size:12px;padding:2px 10px;border-radius:10px;letter-spacing:2px;margin-right:10px;vertical-align:middle}

/* ========== Venn 圖（三圈） ========== */
.venn-wrap{display:flex;align-items:center;justify-content:center;gap:0;margin:30px 0;flex-wrap:wrap;min-height:300px}
.venn-circle{display:flex;flex-direction:column;align-items:center;justify-content:center;width:240px;height:240px;border-radius:50%;border:3px solid;font-size:17px;line-height:1.6;padding:0 24px;text-align:center;font-weight:600;color:#fff;background-blend-mode:multiply;box-sizing:border-box;gap:6px}
.venn-circle small{display:block;font-size:13px;font-weight:400;line-height:1.4;width:100%;text-align:center;margin:0;opacity:.95}
.venn-a{background:rgba(139,46,21,.85);border-color:#8B2500;margin-right:-60px}
.venn-b{background:rgba(30,26,20,.88);border-color:#1e1a14;z-index:2}
.venn-c{background:rgba(184,134,11,.85);border-color:#b8860b;margin-left:-60px}

/* ========== 三悖論卡 ========== */
.triple-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}
.triple-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:22px 20px;text-align:center;box-shadow:0 2px 10px rgba(91,58,41,.06)}
.triple-card .tc-icon{font-size:32px;color:var(--gold);margin-bottom:8px}
.triple-card .tc-title{font-size:21px;font-weight:700;color:var(--accent-red);margin-bottom:10px;letter-spacing:2px}
.triple-card .tc-body{font-size:17px;color:var(--text2);line-height:1.85;text-align:left}

/* ========== 對比表 ========== */
.compare-table{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.compare-table>div{padding:18px 22px;border-radius:8px;border:1px solid var(--border);background:#fffaf0;line-height:1.95;font-size:19px}
.compare-table h5{font-size:19px;color:var(--accent);margin-bottom:8px;border-bottom:1px solid var(--border-light);padding-bottom:6px}
.compare-table .ct-left{border-left:4px solid var(--accentL)}
.compare-table .ct-right{border-left:4px solid var(--gold);background:#fef6e0}
.compare-table .ct-conclusion{grid-column:1/-1;background:linear-gradient(135deg,#fffdf5,#f5ecd8);border-left:4px solid var(--accent-red);font-weight:600;color:var(--accent-red);text-align:center;font-size:18px}

/* ========== 流程／光譜 ========== */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;margin:18px 0;padding:14px 18px;background:#fffaf0;border:1px solid var(--border);border-radius:10px}
.flow-box,.flow-step{background:var(--card);border:1.5px solid var(--gold);border-radius:8px;padding:12px 18px;font-size:17.5px;text-align:center;min-width:160px;color:var(--text);box-shadow:0 2px 6px rgba(184,134,11,.1)}
.flow-step small{display:block;color:var(--text-muted);font-size:13.5px;margin-top:4px}
.flow-arrow{font-size:24px;color:var(--gold);font-weight:700}
.flow.flow-v{flex-direction:column}
.flow-v .flow-arrow{transform:rotate(90deg)}

.spectrum{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;margin:24px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sp-side,.sp-mid{padding:18px 20px;text-align:center;font-size:15.5px;line-height:1.7}
.sp-side{background:#fbeae3;color:var(--accent-red)}
.sp-side h5{color:var(--accent-red);margin-bottom:6px;font-size:18px}
.sp-mid{background:linear-gradient(180deg,var(--gold),var(--goldL));color:#fff}
.sp-mid h5,.sp-mid *{color:#fff!important}
.sp-mid h5{text-shadow:0 1px 3px rgba(0,0,0,.35);font-size:18px;margin-bottom:6px}
.sp-mid small{color:rgba(255,255,255,.92)!important}

/* ========== 反證鏈 ========== */
.refutation-chain{margin:22px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.rc-step{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 28px;font-size:18.5px;text-align:center;min-width:280px;color:var(--text)}
.rc-step.start{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:2px solid var(--gold);font-weight:700}
.rc-step.end{background:#fbeae3;border:2px solid var(--accent-red);color:var(--accent-red);font-weight:700}
.rc-arrow{color:var(--accent-red);font-size:18px;font-weight:700;letter-spacing:2px}
.rc-conclusion{margin-top:14px;background:#1e1a14;color:var(--gold);padding:14px 22px;border-radius:8px;text-align:center;font-size:17.5px;letter-spacing:2px}

/* ========== 矩陣 / 三角 ========== */
.dual-matrix{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
.dual-matrix>div{padding:18px 22px;border-radius:10px;font-size:19px;line-height:1.85;border:2px solid}
.dual-matrix .dm-1{background:linear-gradient(135deg,#fffaf0,#f5ecd8);border-color:var(--gold)}
.dual-matrix .dm-2{background:linear-gradient(135deg,#fbeae3,#f5d6c8);border-color:var(--accent-red)}
.dual-matrix h5{font-size:20px;margin-bottom:8px;letter-spacing:1.5px}
.dual-matrix .dm-conclusion{grid-column:1/-1;background:#1e1a14;color:var(--goldL);border-color:#1e1a14;text-align:center;font-size:18px;letter-spacing:3px}

/* ========== 三圖記憶模型 ========== */
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.three-col .col{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center;font-size:19px;line-height:1.85}
.three-col .col-title{font-size:21.5px;color:var(--accent);font-weight:700;margin-bottom:8px}
.three-col .col small{display:block;color:var(--text-muted);font-size:14.5px;margin-top:8px}
.three-col .col-icon{font-size:42px;color:var(--gold);margin-bottom:6px}

/* ========== 結語 ========== */
.closing{margin:36px auto 0;max-width:880px;text-align:center;padding:30px 20px;background:linear-gradient(135deg,#1e1a14,#3d3225);color:#f4ead4;border-radius:14px}
.closing h3{color:var(--goldL);font-size:26px;letter-spacing:6px;border:none;margin-bottom:14px}
.closing p{font-size:18px;line-height:2;color:#e6dcc4}

/* ========== 頁尾 ========== */
.site-footer{margin-top:60px;padding:30px 20px;background:#1e1a14;color:#9a8a6e;text-align:center;font-size:15px;letter-spacing:2px;font-family:"Noto Sans TC",sans-serif}
.site-footer p{margin:6px 0}

/* ========== 響應式 ========== */
@media (max-width:900px){
  #sb{transform:translateX(-100%);transition:.3s}
  #sb.open{transform:translateX(0)}
  #sbToggle{display:block}
  .main{margin-left:0}
  .ch-body{padding:24px 18px}
  .triple-cards{grid-template-columns:1fr}
  .compare-table,.dual-matrix,.three-col{grid-template-columns:1fr}
  .venn-circle{width:200px;height:200px;margin:0!important}
  .venn-wrap{gap:8px}
  .hero-title{font-size:38px;letter-spacing:3px}
  .ch-name{font-size:26px;letter-spacing:2px}
  .spectrum{grid-template-columns:1fr}
}
@media (max-width:600px){
  body{font-size:17px}
  .hero-title{font-size:30px}
  .toc-name{font-size:17px}
}

/* ===== 多檔合併附加樣式 ===== */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);border:1px solid var(--border);
  border-left:5px solid var(--gold);border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;font-size:12.5px;
  background:var(--gold);color:#fff;padding:3px 12px;border-radius:12px;
  letter-spacing:2.2px;margin-bottom:10px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;}
.bridge b{color:var(--accent-red);}
.ch-frame{display:block;width:100%;border:1px solid var(--border);background:#fffdf7;
  border-radius:12px;box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:200px;}
.next-link{display:inline-block;margin:6px 0 4px;font-family:"Noto Sans TC",sans-serif;
  font-size:17px;color:var(--accent);text-decoration:none;border:1px solid var(--border);
  border-radius:24px;padding:8px 22px;background:var(--card);transition:.25s;}
.next-link:hover{background:var(--gold);color:#fff;border-color:var(--gold);}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}

(function(){
function resizeFrame(f){try{var d=f.contentDocument||f.contentWindow.document;
if(!d||!d.body)return;d.body.style.minHeight='0';d.body.style.height='auto';
if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
var h=d.body.scrollHeight;if(h>100){f.style.height=h+'px';f.style.minHeight='0';}}catch(e){}}
function resizeAll(){document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
if(typeof updateProgress==='function')updateProgress();}
function setupFrame(f){var t=0;function tick(){t++;resizeFrame(f);if(t<30)setTimeout(tick,200);}
if(f.contentDocument&&f.contentDocument.readyState==='complete')tick();else f.addEventListener('load',tick);}
window.setupFrame=setupFrame;window.resizeAllFrames=resizeAll;
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAll,200);});
document.addEventListener('click',function(e){var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;
if(!a)return;var h=a.getAttribute('href');if(!h||h.charAt(0)!=='#'||h.length<2)return;
var id=h.substring(1);var el=document.getElementById(id);if(!el)return;e.preventDefault();
resizeAll();setTimeout(function(){resizeAll();var rect=el.getBoundingClientRect();
var y=window.scrollY+rect.top-20;window.scrollTo({top:y,behavior:'smooth'});},60);},true);
var _rt=0,_riv=setInterval(function(){_rt++;resizeAll();if(_rt>50)clearInterval(_riv);},300);

// 進度條
var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
window.updateProgress=function(){var sh=document.documentElement.scrollHeight-window.innerHeight;
var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
if(rpFill)rpFill.style.width=pct+'%';if(rpPct)rpPct.textContent=Math.round(pct)+'%';};
window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();

// 接近頁尾淡出
(function(){var cap=document.getElementById('readProgress');if(!cap)return;
function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
var t=document.querySelector('.site-footer');
if('IntersectionObserver'in window&&t){var io=new IntersectionObserver(function(es){
setHide(es.some(function(e){return e.isIntersecting;}));},{rootMargin:'0px 0px -20px 0px',threshold:0.01});io.observe(t);}
else{window.addEventListener('scroll',function(){var dh=document.documentElement.scrollHeight;
var sb=window.scrollY+window.innerHeight;setHide(dh-sb<240);},{passive:true});}})();

// 側欄高亮
var items=document.querySelectorAll('.sb-item');
function highlight(){var secs=document.querySelectorAll('.chapter');var act=null;
secs.forEach(function(s){if(s.getBoundingClientRect().top<window.innerHeight*0.35)act=s;});
items.forEach(function(it){var on=act&&it.getAttribute('data-ch')===act.id.replace('chapter-','');
it.classList.toggle('active',!!on);});}
window.addEventListener('scroll',highlight,{passive:true});highlight();

// sb-brand 回頂
var sbBrand=document.getElementById('sbBrand');if(sbBrand)sbBrand.addEventListener('click',function(e){
e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});

// 漢堡
var tg=document.getElementById('sbToggle'),sb=document.getElementById('sb');
if(tg&&sb)tg.addEventListener('click',function(){sb.classList.toggle('open');});

// 回頂按鈕
var bt=document.getElementById('backTop');
if(bt){window.addEventListener('scroll',function(){bt.style.display=window.scrollY>600?'flex':'none';},{passive:true});
bt.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});}

// 防複製（外層）
var blk=function(e){e.preventDefault();return false;};
['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
document.addEventListener(ev,blk,true);});
document.addEventListener('keydown',function(e){var k=e.key;
if(e.ctrlKey&&'cCaAsSpPuUxX'.indexOf(k)>=0)blk(e);if(k==='F12')blk(e);
if(e.ctrlKey&&e.shiftKey&&'IJCK'.indexOf(k)>=0)blk(e);},true);
})();

<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-78-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
